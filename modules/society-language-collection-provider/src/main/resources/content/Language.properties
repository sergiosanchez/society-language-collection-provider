cookie-locale-collection-provider-configuration-name=Noticias por sociedad (cookie) e idioma
cookie-locale-collection-provider-label=Noticias por sociedad e idioma
cookie-name=Nombre de la cookie de sociedad
cookie-name-help=Cookie de la que se lee el valor de la sociedad del usuario.
cookie-value-mappings=Correspondencia valor de cookie / categoría
cookie-value-mappings-help=Pares valor=ERC (por ejemplo, COMPANY_A=sociedad-a). Si un valor no aparece aquí, se usa el propio valor de la cookie como External Reference Code de la categoría.
ddm-structure-key=Clave de la estructura de noticia
ddm-structure-key-help=Structure Key de la estructura de contenido web que se mostrará (se busca en el sitio actual y en sus ancestros, incluido Global).
language-field-prefix=Prefijo del campo localizado del índice
language-field-prefix-help=Se exige que exista el campo prefijo + idioma (por ejemplo, title_en_US). Solo existe si el artículo está traducido a ese idioma.
show-all-when-cookie-missing=Mostrar todo si no hay cookie
show-all-when-cookie-missing-help=Si está activo y el usuario no tiene la cookie, se muestran las noticias de todas las sociedades (solo se filtra por idioma). Si no, la colección queda vacía.
